chain:
  as: hypershift-kubevirt-run-e2e-local
  steps:
  - as: run-e2e-local
    cli: latest
    commands: |-

        if [ "$SKIP_E2E_LOCAL" == "true" ]; then
            echo "Skipping e2e local"
            exit 0
        fi

        function cleanup() {
          for child in $( jobs -p ); do
            kill "${child}"
          done
          wait
        }
        trap cleanup EXIT
      
        STORAGE_CLASS_FLAG=""
        if [[ -n ${ETCD_STORAGE_CLASS} ]]; then
          STORAGE_CLASS_FLAG="--e2e.etcd-storage-class=${ETCD_STORAGE_CLASS}"
        fi

        ROOT_VOLUME_MODE_FLAG=""
        if [[ -n ${KUBEVIRT_ROOT_VOLUME_VOLUME_MODE} ]]; then
          ROOT_VOLUME_MODE_FLAG="--e2e.kubevirt-root-volume-volume-mode=${KUBEVIRT_ROOT_VOLUME_VOLUME_MODE}"
        fi

        export EVENTUALLY_VERBOSE="false"

        # run the test
        hack/ci-test-e2e.sh \
                  --test.v \
                  --test.timeout=0 \
                  --test.run="${E2E_TEST_REGEX}" \
                  --e2e.node-pool-replicas=2 \
                  --e2e.kubevirt-node-memory="10Gi" \
                  --e2e.kubevirt-node-cores="4" \
                  --e2e.platform="KubeVirt" \
                  --e2e.latest-release-image=${OCP_IMAGE_LATEST} \
                  --e2e.previous-release-image=${OCP_IMAGE_PREVIOUS} \
                  ${STORAGE_CLASS_FLAG} \
                  ${ROOT_VOLUME_MODE_FLAG} \
                  --e2e.pull-secret-file=/etc/ci-pull-credentials/.dockerconfigjson

    credentials:
      - mount_path: /etc/ci-pull-credentials
        bundle: ci-pull-credentials
        namespace: test-credentials
    dependencies:
      - env: OCP_IMAGE_LATEST
        name: release:latest
      - env: OCP_IMAGE_PREVIOUS
        name: release:initial
    env:
      - default: ${SHARED_DIR}/management_cluster_kubeconfig
        name: KUBECONFIG
      - default: ""
        name: ETCD_STORAGE_CLASS
      - default: "^TestCreateCluster$|TestNodePool|TestAutoscaling"
        name: E2E_TEST_REGEX
      - default: "false"
        name: SKIP_E2E_LOCAL
      - default: ""
        name: KUBEVIRT_ROOT_VOLUME_VOLUME_MODE
        documentation: |-
          volumeMode of the PVC backing the root disk of the guest cluster nodes,
          "Block" or "Filesystem". Empty leaves the e2e binary's own default, which
          is Filesystem. Set it to Block on storage where a Filesystem root disk is
          not stable: with volumeMode=Filesystem the disk is an image file sized to
          the free space of the PVC's filesystem, so it can come back smaller after
          the node reboots out of its Ignition first boot, which invalidates the GPT
          that first boot grew to the old end of the disk and leaves the node in the
          dracut emergency shell.
    from: hypershift-tests
    grace_period: 30m0s
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
    timeout: 1h30m0s

