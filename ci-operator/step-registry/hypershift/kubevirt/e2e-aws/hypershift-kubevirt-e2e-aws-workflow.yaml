workflow:
  as: hypershift-kubevirt-e2e-aws
  documentation: |-
    Sets up all the mgmt/infra cluster prerequisites necessary for hypershift kubevirt guest clusters on AWS infra.
    Then runs basic hypershift e2e tests.

    Learn more about HyperShift here: https://github.com/openshift/hypershift

    Track HyperShift's development here: https://issues.redhat.com/projects/HOSTEDCP
  steps:
    env:
      COMPUTE_NODE_TYPE: c5n.metal
      COMPUTE_NODE_REPLICAS: "1"
      CONTROL_PLANE_INSTANCE_TYPE: "m6i.2xlarge"
      HYPERSHIFT_NODE_COUNT: "2"
      ZONES_COUNT: "3"
      ENABLE_HYPERSHIFT_OPERATOR_VALIDATING_WEBHOOK: "true"
      ETCD_STORAGE_CLASS: gp3-csi
      KUBEVIRT_CSI_INFRA: gp3-csi
      CNV_SUBSCRIPTION_SOURCE: redhat-operators
      # gp3-csi root disks have to be raw block devices. A Filesystem one is an
      # image file that CDI sizes to the free space of the PVC's filesystem, and
      # KubeVirt resizes it again on every start of the domain, so the guest sees
      # a smaller disk after it reboots out of its Ignition first boot and the GPT
      # that first boot grew to the old end of the disk no longer describes it.
      KUBEVIRT_ROOT_VOLUME_VOLUME_MODE: Block
    pre:
      - chain: ipi-aws-ovn-pre
      - chain: ipi-install
      - ref: hypershift-kubevirt-install
      - ref: hypershift-install
    test:
      - chain: hypershift-kubevirt-run-e2e-local
      - chain: hypershift-kubevirt-run-e2e-external
    post:
      - chain: hypershift-dump
      - chain: gather-core-dump
      - chain: hypershift-kubevirt-destroy
      - chain: ipi-aws-post
